name: Apply playback recovery fix

on:
  push:
    paths:
      - ".github/workflows/apply-playback-recovery-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply tested playback recovery patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/playback-recovery.patch
          git apply --check /tmp/playback-recovery.patch
          git apply /tmp/playback-recovery.patch
          python3 -c 'from pathlib import Path; p=Path("app/page.tsx"); s=p.read_text(); old="网络波动，缓冲 {STALL_RECOVERY_BUFFER_SECONDS} 秒后继续…"; assert s.count(old)==1; p.write_text(s.replace(old,"播放缓冲中，正在自动恢复…",1))'
          git diff --check
          git diff -- app/page.tsx

      - name: Commit playback recovery fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "fix: recover playback stalls without rebuffer deadlocks"
          git push origin HEAD:main
