name: Apply playback recovery fix

on:
  push:
    paths:
      - ".github/workflows/apply-playback-recovery-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply tested playback recovery patch
        shell: bash
        run: |
          echo '' | base64 -d | python3
          git diff --check
          git diff -- app/page.tsx

      - name: Commit playback recovery fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "fix: recover playback stalls without rebuffer deadlocks"
          git push origin HEAD:main
