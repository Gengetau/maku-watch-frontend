name: Materialize Maku v20 source retry

on:
  push:
    paths:
      - ".github/workflows/materialize-v20-source-retry.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"

      - name: Materialize and patch source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .materialize-src
          mkdir -p .materialize-src
          unzip -q maku-watch-frontend-v19.zip -d .materialize-src
          cp -a .materialize-src/maku-watch-frontend-v19/source/. .
          patch -p1 < .materialize/maku-v20.patch
          rm -rf .materialize-src

      - name: Install, lint, and test
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm test

      - name: Commit materialized v20 source
        shell: bash
        run: |
          set -euo pipefail
          rm -f maku-watch-frontend-v19.zip
          rm -rf .materialize
          rm -f .github/workflows/materialize-v20-source.yml
          rm -f .github/workflows/materialize-v20-source-retry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: improve mobile and invitation UX"
          git push
