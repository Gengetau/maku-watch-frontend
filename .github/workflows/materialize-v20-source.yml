name: Materialize Maku v20 source

on:
  push:
    paths:
      - ".github/workflows/materialize-v20-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: .materialize/maku-watch-frontend-v19/source/package-lock.json

      - name: Materialize and patch source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .materialize
          mkdir -p .materialize
          unzip -q maku-watch-frontend-v19.zip -d .materialize
          cp -a .materialize/maku-watch-frontend-v19/source/. .
