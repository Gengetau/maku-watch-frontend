          npm ci
          npm run lint
          npm test

      - name: Commit materialized v20 source
        shell: bash
        run: |
          set -euo pipefail
          rm -f maku-watch-frontend-v19.zip
          rm -f .github/workflows/materialize-v20-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: improve mobile and invitation UX"
          git push
